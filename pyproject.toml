[project]
name = "anolis-provider-adafruit"
version = "0.1.0"
description = "Anolis device provider for Adafruit hardware, built on Adafruit's CircuitPython drivers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # The Python provider SDK. Not on PyPI yet: pinned to a commit on its main branch.
    "anolis-provider-sdk @ git+https://github.com/anolishq/anolis-provider-sdk-python@84cfe6c188d301766833c403765ba14d8d80b44b",
    # Adafruit's drivers. They run on Linux through Adafruit Blinka, which they depend on.
    "adafruit-circuitpython-bme280>=2.6,<3",
    "adafruit-circuitpython-motor>=3.5,<4",
    "adafruit-circuitpython-pca9685>=3.4,<4",
    "adafruit-circuitpython-sht4x>=1.0,<2",
    "adafruit-circuitpython-shtc3>=1.1,<2",
    "adafruit-extended-bus>=1.0,<2",
    # Blinka's platform libraries for the Raspberry Pi, which Blinka does not
    # declare. On a Pi, importing digitalio needs gpiod and importing pwmio
    # needs the Pi PWM library, or Blinka raises RuntimeError. The BME280 and
    # motor drivers import them for type hints alone, guarded against ImportError
    # only, so without these neither loads on a Pi. The Pi PWM library is an
    # sdist only: it builds a small C extension, so installing on Linux needs a
    # C compiler. The bounds are the ones Blinka asks for.
    "gpiod>=2.2.2,<3; sys_platform == 'linux'",
    "Adafruit-Blinka-Raspberry-Pi-PWM>=1.0.2,<2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "anolis-protocol[conformance] @ https://github.com/anolishq/anolis-protocol/releases/download/v1.10.0/anolis_protocol-1.10.0-py3-none-any.whl",
    "ruff>=0.15.0,<1.0.0",
    "mypy>=1.13",
    "pytest>=8",
    "types-PyYAML>=6.0",
    "types-protobuf>=5",
    "types-jsonschema>=4.17",
]
freeze = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
anolis-provider-adafruit = "anolis_provider_adafruit.provider:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/anolis_provider_adafruit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Generated protobuf modules and the CircuitPython drivers ship without type stubs.
module = ["anolis.*", "adafruit_bme280.*", "adafruit_extended_bus", "adafruit_bus_device.*", "adafruit_motor.*", "adafruit_pca9685", "adafruit_sht4x", "adafruit_shtc3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["conformance: runs the anolis-protocol conformance harness against the provider in mock mode"]
