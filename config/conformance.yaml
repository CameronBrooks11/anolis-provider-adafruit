# Mock-mode config for the conformance harness and CI: two BME280s at both of
# the board's addresses and a Motor HAT, on a simulated bus. No hardware needed.
mock: true
devices:
  - id: env0
    type: bme280
    label: Environment sensor 0
  - id: env1
    type: bme280
    address: 0x76
  - id: motors0
    type: motor_hat
    label: Motor HAT
